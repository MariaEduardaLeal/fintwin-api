# ==============================================================================
# Nginx Reverse Proxy - FinTwin API
# Domain: fintwin.freedevs.tech -> fintwin-api:8000 (infra-net)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name fintwin.freedevs.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/conf.d/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fintwin.freedevs.tech;

    ssl_certificate     /etc/nginx/certs/live/fintwin.freedevs.tech/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/fintwin.freedevs.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "DENY"                                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

    client_max_body_size 16M;

    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_fintwin_api http://fintwin-api:8000;
        proxy_pass $upstream_fintwin_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
